# Application
spring.application.name=kafka-springboot-demo
server.port=8080

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=kafka-demo-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.denzil.kafka.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.denzil.kafka.model.OrderEvent

# Kafka Topics
kafka.topic.order=order-events
kafka.topic.order.dlt=order-events.DLT
kafka.topic.notification=notification-events

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.denzil=DEBUG
logging.level.org.springframework.kafka=INFO

spring.profiles.active=local